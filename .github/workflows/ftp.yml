name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'Openvario/website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the built pages
        run: python3 hooks/pre-commit --all
      - name: Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PWD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.ruff_cache/**
            **/content/**
            **/hooks/**
            **/build.py
            **/README.md
            **/.pre-commit-config.yaml
